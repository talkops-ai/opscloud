[project]
name = "talkops-opscloud"
version = "0.3.0b2"
description = "Extensible Terminal Multi-Agent Framework for Cloud Operations & DevOps Coding"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-client-protocol>=0.11.0",
    "aiosqlite>=0.22.1",
    "anyio>=4.14.2",
    "boto3>=1.43.51",
    "deepagents[quickjs]>=0.7.1",
    "deepagents-acp>=0.0.9",
    "filelock>=3.18.0",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-core>=1.5.3",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.4.1",
    "langchain-anthropic>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langgraph>=1.2.10",
    "langgraph-cli[inmem]>=0.4.31",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langgraph-sdk>=0.4.2",
    "langsmith>=0.10.6",
    "markdown-it-py>=4.2.0",
    "markdownify>=1.2.3",
    "mcp>=1.28.1",
    "packaging>=26.2",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pygments>=2.20.0",
    "pyperclip>=1.11.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "rich-pixels>=3.0.0",
    "tavily-python>=0.7.26",
    "textual>=8.2.8",
    "tomli-w>=1.2.0",
    "typing-extensions>=4.16.0",
    "urllib3>=2.7.0",
    "uuid-utils>=0.17.0",
    "genai-prices>=0.1.0",
    "bashlex>=0.18",
    "colorama>=0.4.6",
    "loguru>=0.7.3",
    "psycopg[binary]>=3.2.0",
    "tomli>=1.1.0",
    "langchain-aws>=0.2.14",
    "langchain-typesafe>=0.0.1a3",
    "langchain-deepseek>=1.1.1",
    "langchain-groq>=1.1.3",
    "langchain-mistralai>=1.1.6",
    "langchain-cohere>=0.6.0",
    "langchain-fireworks>=1.3.1",
    "langchain-together>=0.4.0",
    "langchain-xai>=1.3.0",
    "langchain-google-vertexai>=3.2.4",
    "langchain-ollama>=1.1.0",
    "langchain-openrouter>=0.2.9",
    "langchain-perplexity>=1.4.1",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-huggingface>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "pytest-cov>=5.0",
]
test-integration = [
    "agentevals>=0.0.8",
    "langsmith>=0.10.6",
]
sandboxes = [
    "daytona>=0.217.0",
    "langchain-daytona>=0.0.8",
    "langchain-modal>=0.0.6",
    "langchain-runloop>=0.0.7",
    "modal>=1.5.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "pytest-cov>=5.0",
    "agentevals>=0.0.8",
    "langsmith>=0.10.6",
]

[project.scripts]
opscloud = "opscloud.cli.main:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opscloud"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
    "unit: Fast deterministic unit tests (no API keys needed)",
    "integration: Tests requiring real LLM APIs and external services",
    "eval: Agent behavior evaluation tests with LangSmith datasets",
]

[tool.ruff]
target-version = "py312"

